<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fitence — ouverture du store</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0D0D16; --card: #1D1D2A; --border: #252535; --acc: #FF4D1A; --txt: #EEEEF5; --muted: #6A6A85; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--txt); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 16px; }
  .logo span { color: var(--acc); }
  p { margin: 0 0 16px; color: var(--muted); }
  .opening { color: var(--txt); }
  .other .opening { display: none; }
  a.store { display: block; margin: 0 0 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--txt); text-decoration: none; }
  a.store small { display: block; font-size: 12px; color: var(--muted); }
  a.store strong { font-size: 18px; }
  a.more { color: var(--acc); }
</style>
</head>
<body>
<main>
  <div class="logo"><span>Fit</span>ence</div>
  <p class="opening" data-t="opening">Ouverture du store…</p>
  <p data-t="fallback">Si rien ne se passe, choisissez votre store :</p>
  <a class="store" href="https://apps.apple.com/app/apple-store/id6769868181?pt=128888408&amp;ct=qr-fr-near&amp;mt=8"><small data-t="appstore">Télécharger sur</small><strong>App Store</strong></a>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.corehelperlab.fitence.workout&amp;referrer=utm_source%3Dqr%26utm_medium%3Dflyer%26utm_campaign%3Dqr-fr-near"><small data-t="gplay">Disponible sur</small><strong>Google Play</strong></a>
  <p><a class="more" id="more" href="/fitence-workout/fr/" data-t="more">Découvrir Fitence</a></p>
</main>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var p = ios ? 'ios' : /Android/.test(ua) ? 'android' : 'other';
  var T = {"fr":{"title":"Fitence — ouverture du store","opening":"Ouverture du store…","fallback":"Si rien ne se passe, choisissez votre store :","appstore":"Télécharger sur","gplay":"Disponible sur","more":"Découvrir Fitence","landing":"/fitence-workout/fr/"},"es":{"title":"Fitence — abriendo la tienda","opening":"Abriendo la tienda…","fallback":"Si no pasa nada, elige tu tienda:","appstore":"Descárgalo en el","gplay":"Disponible en","more":"Conoce Fitence","landing":"/fitence-workout/es/"},"uk":{"title":"Fitence — відкриваємо магазин","opening":"Відкриваємо магазин застосунків…","fallback":"Якщо нічого не сталося, обери магазин:","appstore":"Завантажити в","gplay":"Доступно в","more":"Дізнатися про Fitence","landing":"/fitence-workout/ua/"}};
  var langs = navigator.languages || [navigator.language || ''];
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i]).slice(0, 2).toLowerCase();
    if (T[l]) {
      if (l !== "fr") {
        document.documentElement.lang = l;
        document.title = T[l].title;
        var els = document.querySelectorAll('[data-t]');
        for (var j = 0; j < els.length; j++) els[j].textContent = T[l][els[j].getAttribute('data-t')];
        document.getElementById('more').href = T[l].landing;
      }
      break;
    }
  }
  try {
    if (navigator.sendBeacon) navigator.sendBeacon("https://us-central1-fitence---workout-planner.cloudfunctions.net/qrScan", JSON.stringify({ id: "fr-near", p: p }));
  } catch (e) {}
  if (p === 'ios') location.replace("https://apps.apple.com/app/apple-store/id6769868181?pt=128888408&ct=qr-fr-near&mt=8");
  else if (p === 'android') location.replace("https://play.google.com/store/apps/details?id=com.corehelperlab.fitence.workout&referrer=utm_source%3Dqr%26utm_medium%3Dflyer%26utm_campaign%3Dqr-fr-near");
  else document.documentElement.className = 'other';
})();
</script>
</body>
</html>
